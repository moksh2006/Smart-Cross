# SmartCross: docker compose up --build   ->  http://localhost:8080
services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smartcross
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host by default. Uncomment for local tools:
    # ports: ["27017:27017"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/smartcross
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      TRUST_PROXY: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-smartcross}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      RAILRADAR_API_KEY: ${RAILRADAR_API_KEY:-}
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mongo_data:
